name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Oldest Xcode the project supports (see AGENTS.md); update with the runner image.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: xcodebuild -scheme TallyMarkiOS -destination "$DESTINATION" -quiet build

      - name: Run tests
        run: >
          xcodebuild -scheme TallyMarkiOSTests -destination "$DESTINATION"
          -resultBundlePath TestResults.xcresult -quiet test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
